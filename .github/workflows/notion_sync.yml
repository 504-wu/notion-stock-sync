name: Auto Update Notion Stock Metrics

on:
  schedule:
    # 設定每天台灣時間早上 06:48、07:48、08:48 
    - cron: '48 22,23,00 * * *'
  workflow_dispatch: # 隨時可以手動按按鈕強制執行

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance pandas

    - name: Run Script
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        DATABASE_ID: ${{ secrets.DATABASE_ID }}
      # 精確對齊你在電腦與網頁上的 Stock.py 檔名
      run: python Stock.py
