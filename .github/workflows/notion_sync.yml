name: Auto Update Notion Stock Metrics

on:
  schedule:
    # 台灣時間 06:36 (UTC 22:36) -> 避開整點
    - cron: '36 22 * * *'
    # 台灣時間 07:13 (UTC 23:13) -> 避開半點與整點
    - cron: '13 23 * * *'
    # 台灣時間 08:27 (UTC 00:27) -> 台股開盤前 30 分鐘
    - cron: '27 0 * * *'
    
  workflow_dispatch: # 隨時可以手動按按鈕強制執行

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance pandas

    - name: Run Script
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        DATABASE_ID: ${{ secrets.DATABASE_ID }}
      # 精確對齊你在電腦與網頁上的 Stock.py 檔名
      run: python Stock.py
