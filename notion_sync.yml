name: Auto Update Notion Stock Metrics

on:
  schedule:
    # 🎯 設定每天台灣時間下午 16:30 自動執行 (對應 UTC 早上 08:30)
    - cron: '30 08 * * *'
  workflow_dispatch: 

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance pandas

    - name: Run Script
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        DATABASE_ID: ${{ secrets.DATABASE_ID }}
      
      run: python Stock.py
